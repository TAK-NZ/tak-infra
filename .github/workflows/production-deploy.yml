name: Production Deployment

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment without tag'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    uses: ./.github/workflows/cdk-test.yml

  build-images:
    uses: ./.github/workflows/production-build.yml
    secrets: inherit

  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    needs: [test, build-images]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup CDK Environment
        uses: ./.github/actions/setup-cdk
        with:
          aws-role-arn: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.PROD_AWS_REGION }}
          role-session-name: GitHubActions-Production

      - name: Bootstrap CDK (if needed)
        run: |
          if ! aws cloudformation describe-stacks --stack-name CDKToolkit 2>/dev/null; then
            npx cdk bootstrap aws://${{ secrets.PROD_AWS_ACCOUNT_ID }}/${{ secrets.PROD_AWS_REGION }} --context envType=prod
          fi

      - name: Validate Production Change Set
        run: |
          # Check if override is requested
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"[force-deploy]"* ]]; then
            echo "🚨 Force deploy detected - skipping change set validation"
          else
            ./scripts/github/validate-changeset.sh TAK-${{ vars.PROD_STACK_NAME }}-TakInfra
          fi

      - name: Configure PKI notifications
        id: pki-config
        env:
          PKI_ALERT_EMAIL: ${{ vars.PROD_PKI_ALERT_EMAIL }}
          PKI_INFO_EMAIL: ${{ vars.PROD_PKI_INFO_EMAIL }}
        run: |
          # Optional repository or organization variables; each one that is set becomes a CDK context value
          flags=""
          for pair in "pkiAlertEmail=${PKI_ALERT_EMAIL}" "pkiInfoEmail=${PKI_INFO_EMAIL}"; do
            value="${pair#*=}"
            [[ -n "${value}" ]] || continue
            [[ "${value}" =~ ^[^[:space:]@]+@[^[:space:]@]+$ ]] || { echo "::error::${pair%%=*}: not an email address"; exit 1; }
            flags="${flags} --context ${pair%%=*}=${value}"
          done
          echo "context=${flags}" >> "$GITHUB_OUTPUT"
      - name: Deploy Production
        run: npm run cdk deploy -- --context envType=prod --context stackName=${{ vars.PROD_STACK_NAME }} --context usePreBuiltImages=true --context takImageTag=${{ needs.build-images.outputs.tak-tag }} ${{ steps.pki-config.outputs.context }} --require-approval never