name: Test CDK code

# This workflow is triggered on pushes and pull requests to the main branch.
# It can also be triggered manually.
# It runs tests on the CDK code to ensure that it is functioning correctly.
# The workflow will not run for draft pull requests.

on:
  push:
    branches:
      - main
      - feature/ca-overhaul
  pull_request:
    branches:
      - main
      - feature/ca-overhaul
  workflow_call:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - run: echo "🌅 Job triggered by ${{ github.event_name }} event"
      - run: echo "💨 Job running on ${{ runner.os }}"
      - run: echo "🕊️ Branch is ${{ github.ref }}"
      - run: echo "👾 Repository is ${{ github.repository }}."
      
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Install system dependencies
        # Required for TAK server XML configuration validation (xmllint)
        # Note: auth-infra doesn't need this, but tak-infra has XML validation tests.
        # softhsm2, opensc, libengine-pkcs11-openssl and jq are for the kms-ca.sh tests (SoftHSM stands in for KMS).
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils softhsm2 opensc libengine-pkcs11-openssl jq

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
            node-version: '22'
            registry-url: https://registry.npmjs.org/
            cache: 'npm'

      - name: Install CDK package dependencies
        run: npm ci  # Use npm ci for faster, reliable installs

      - name: TypeScript compilation check
        run: npx tsc --noEmit --skipLibCheck

      - name: Check for Breaking Changes
        run: |
          # Check if override is requested
          OVERRIDE="false"
          if [[ "${{ github.event.head_commit.message }}" == *"[force-deploy]"* ]]; then
            OVERRIDE="true"
          fi
          ./scripts/github/check-breaking-changes.sh tak prod $OVERRIDE

      - name: Test kms-ca.sh (CA signing through PKCS#11)
        run: test/KmsCa/test-kms-ca.sh

      - name: Test pki-bootstrap.sh (first-boot PKI)
        run: test/KmsCa/test-pki-bootstrap.sh

      - name: Test cert-metrics.sh (certificate metrics)
        run: test/KmsCa/test-cert-metrics.sh

      - name: Test cluster-lock.sh (lock for steps that run once per cluster)
        run: test/KmsCa/test-cluster-lock.sh
      - name: Test cluster-lock.sh on Ubuntu 22.04 and 24.04 (GNU coreutils; the runner image has uutils)
        run: |
          for image in ubuntu:22.04 ubuntu:24.04; do
            docker run --rm -v "$PWD":/repo -w /repo "$image" test/KmsCa/test-cluster-lock.sh
          done
      - name: Run tests with coverage report
        run: npm run test:coverage