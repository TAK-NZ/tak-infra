name: Demo Testing Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: demo-deploy
  cancel-in-progress: false

jobs:
  # Run CDK unit tests and linting
  test:
    uses: ./.github/workflows/cdk-test.yml

  # Build Docker images for demo environment
  build-images:
    uses: ./.github/workflows/demo-build.yml
    secrets: inherit

  # Validate production configuration without deploying
  # Runs in parallel with build-images to save time
  validate-prod:
    runs-on: ubuntu-latest
    environment: demo
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup CDK Environment
        uses: ./.github/actions/setup-cdk
        with:
          aws-role-arn: ${{ secrets.DEMO_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.DEMO_AWS_REGION }}
          role-session-name: GitHubActions-Demo

      - name: Validate CDK Synthesis (Prod Profile)
        run: npm run cdk synth -- --context envType=prod --context stackName=${{ vars.DEMO_STACK_NAME }} --context pkiKmsCaEnabled=false --context bedrockKnowledgeBases=nema-cdem,nzdf

      - name: Validate Change Set
        run: |
          # Check if override is requested
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"[force-deploy]"* ]]; then
            echo "🚨 Force deploy detected - skipping change set validation"
          else
            ./scripts/github/validate-changeset.sh TAK-${{ vars.DEMO_STACK_NAME }}-TakInfra
          fi

  # Deploy demo environment with production configuration for testing
  # Uses built images and runs automated tests
  deploy-and-test:
    runs-on: ubuntu-latest
    environment: demo
    needs: [validate-prod, build-images]
    outputs:
      tak-tag: ${{ needs.build-images.outputs.tak-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup CDK Environment
        uses: ./.github/actions/setup-cdk
        with:
          aws-role-arn: ${{ secrets.DEMO_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.DEMO_AWS_REGION }}
          role-session-name: GitHubActions-Demo

      - name: Configure Database Context
        id: db-config
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          # The dev-test profile runs a provisioned db.t4g.large on Aurora I/O-Optimized storage.
          # The prod window must keep the SAME instance class and storage type: otherwise the
          # database would be resized on every run, and AWS only allows moving from
          # I/O-Optimized back to Standard storage once every 30 days, so that would fail.
          # The prod profile leaves ioOptimized unset, hence it is passed explicitly in BOTH branches.
          if [[ "$COMMIT_MSG" != *"[use-prod-db]"* ]]; then
            echo "🔄 Using dev-test database settings for faster deployment"
            echo "db-context=--context instanceClass=db.t4g.large --context ioOptimized=true --context instanceCount=1 --context enablePerformanceInsights=false --context monitoringInterval=0 --context backupRetentionDays=7 --context deleteProtection=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 Using production database settings (storage type kept at I/O-Optimized)"
            echo "db-context=--context ioOptimized=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Demo with Prod Profile
        run: npm run cdk deploy -- --context envType=prod --context stackName=${{ vars.DEMO_STACK_NAME }} --context pkiKmsCaEnabled=false --context bedrockKnowledgeBases=nema-cdem,nzdf --context letsEncryptMode=production --context usePreBuiltImages=true --context takImageTag=${{ needs.build-images.outputs.tak-tag }} --context useS3TAKServerConfigFile=true ${{ steps.db-config.outputs.db-context }} --require-approval never

      - name: Wait for Testing Period
        run: sleep ${{ vars.DEMO_TEST_DURATION || '300' }}

      - name: Run Automated Tests
        run: |
          echo "Placeholder for automated tests"
          # TODO: Add health checks and integration tests
          # Health check URL should be retrieved from BaseInfra stack outputs
          # curl -f https://$(aws cloudformation describe-stacks --stack-name TAK-${{ vars.DEMO_STACK_NAME }}-BaseInfra --query 'Stacks[0].Outputs[?OutputKey==`DomainNameOutput`].OutputValue' --output text)/health || exit 1

  # Always revert demo environment back to dev-test configuration
  # Ensures demo environment is left in a consistent state regardless of test results
  revert-to-dev-test:
    runs-on: ubuntu-latest
    environment: demo
    needs: [deploy-and-test]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup CDK Environment
        uses: ./.github/actions/setup-cdk
        with:
          aws-role-arn: ${{ secrets.DEMO_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.DEMO_AWS_REGION }}
          role-session-name: GitHubActions-Demo

      - name: Validate CDK Synthesis (Dev-Test Profile)
        run: npm run cdk synth -- --context envType=dev-test --context stackName=${{ vars.DEMO_STACK_NAME }} --context pkiKmsCaEnabled=false --context bedrockKnowledgeBases=nema-cdem,nzdf

      - name: Revert Demo to Dev-Test Profile
        run: npm run cdk deploy -- --context envType=dev-test --context stackName=${{ vars.DEMO_STACK_NAME }} --context pkiKmsCaEnabled=false --context bedrockKnowledgeBases=nema-cdem,nzdf --context letsEncryptMode=production --context usePreBuiltImages=true --context takImageTag=${{ needs.deploy-and-test.outputs.tak-tag }} --context useS3TAKServerConfigFile=true --require-approval never